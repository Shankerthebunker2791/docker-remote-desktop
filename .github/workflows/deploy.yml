# =============================================================================
# GitHub Actions — Clean, Build & Spin Up VMs on Self-Hosted Runner
#
# Works on any self-hosted runner: Linux, macOS, or Windows.
#
# On every push to any branch (or manual trigger):
#   1. Cleans ALL Docker state on the runner (full purge)
#   2. Builds the Xubuntu image from scratch
#   3. Spins up all three VMs (xubuntu, windows, macos) via docker compose
#   4. Runs validation tests and generates a JUnit report
#
# The VMs stay running on the remote machine until the next push triggers
# a fresh clean + redeploy.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME   — Docker Hub username
#   DOCKERHUB_TOKEN      — Docker Hub access token
#
# Required Repository Variable (Settings → Variables → Actions):
#   RUNNER_LABEL         — Your self-hosted runner label
#                          (e.g., "self-hosted", "linux-docker", "macos-runner")
# =============================================================================

name: Deploy VMs

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: xubuntu-dev
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: CLEAN
  # ═══════════════════════════════════════════════════════════════════════════
  clean:
    name: Clean Runner
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}

    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4

      - name: Stop all running compose projects
        shell: bash
        run: |
          docker compose -f docker-compose-xubuntu.yml down -v 2>/dev/null || true
          docker compose -f docker-compose-windows.yml down 2>/dev/null || true
          docker compose -f docker-compose-macos.yml down 2>/dev/null || true

      - name: Kill any leftover containers
        shell: bash
        run: |
          docker rm -f xubuntu-vm xubuntu-vm-interactive windows-vm macos-vm 2>/dev/null || true

      - name: Purge all Docker state
        shell: bash
        run: |
          docker system prune -af --volumes
          docker builder prune -af
          echo "✓ Docker fully cleaned"

      - name: Remove old project data
        shell: bash
        run: |
          rm -rf shared projects windows-data windows-shared macos-data macos-shared 2>/dev/null || true
          echo "✓ Data directories removed"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: BUILD
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Build Images
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    needs: clean

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Xubuntu image
        shell: bash
        run: |
          docker build --no-cache -f Dockerfile.xubuntu -t ${{ env.IMAGE_NAME }}:latest .
          echo "✓ Built ${{ env.IMAGE_NAME }}:latest"

      - name: Pull Windows and macOS images
        shell: bash
        run: |
          docker pull dockurr/windows
          docker pull dockurr/macos
          echo "✓ All images ready"

      - name: Clean build artifacts
        shell: bash
        run: |
          docker builder prune -af
          docker image prune -f

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: DEPLOY (Spin Up VMs)
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Spin Up VMs
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create shared directories
        shell: bash
        run: mkdir -p shared projects windows-shared macos-shared

      - name: Start Xubuntu
        shell: bash
        run: |
          docker compose -f docker-compose-xubuntu.yml up -d
          echo "✓ Xubuntu → RDP localhost:3392 (ubuntu/ubuntu)"

      - name: Start Windows
        shell: bash
        run: |
          docker compose -f docker-compose-windows.yml up -d
          echo "✓ Windows → RDP localhost:3390 (Docker/admin) | Web http://localhost:8009"

      - name: Start macOS
        shell: bash
        run: |
          docker compose -f docker-compose-macos.yml up -d
          echo "✓ macOS → VNC localhost:5901 | Web http://localhost:8006"

      - name: Wait for services to initialize
        shell: bash
        run: sleep 20

      - name: Show running containers
        shell: bash
        run: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: TEST
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Validate VMs
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validation tests
        shell: bash
        run: |
          mkdir -p test-results
          REPORT="test-results/junit-report.xml"
          TESTS=0; FAILURES=0; START=$(date +%s)

          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$REPORT"
          echo '<testsuites>' >> "$REPORT"
          echo '  <testsuite name="VMValidation">' >> "$REPORT"

          run_test() {
            local name="$1"; shift
            TESTS=$((TESTS + 1))
            if eval "$@" > /dev/null 2>&1; then
              echo "    <testcase classname=\"VMValidation\" name=\"${name}\"/>" >> "$REPORT"
              echo "✓ ${name}"
            else
              FAILURES=$((FAILURES + 1))
              echo "    <testcase classname=\"VMValidation\" name=\"${name}\"><failure message=\"FAILED\"/></testcase>" >> "$REPORT"
              echo "✗ ${name}"
            fi
          }

          # ── Xubuntu Tests ──
          run_test "Xubuntu container running" \
            "docker ps --filter name=xubuntu-vm --filter status=running --format '{{.Names}}' | grep -qx xubuntu-vm"

          run_test "xrdp listening on 3389" \
            "docker exec xubuntu-vm bash -c 'ss -tlnp | grep -q :3389'"

          run_test "Python 3.12 installed" \
            "docker exec xubuntu-vm bash -c 'python3 --version | grep -q 3.12'"

          run_test "Java 21 installed" \
            "docker exec xubuntu-vm bash -c 'java -version 2>&1 | grep -q 21'"

          run_test "Node.js 20 installed" \
            "docker exec xubuntu-vm bash -c 'node --version | grep -q v20'"

          run_test "Docker CLI inside Xubuntu" \
            "docker exec xubuntu-vm bash -c 'docker --version | grep -q Docker'"

          run_test "Gradle installed" \
            "docker exec xubuntu-vm bash -c 'gradle --version 2>&1 | grep -q Gradle'"

          run_test "Maven installed" \
            "docker exec xubuntu-vm bash -c 'mvn --version 2>&1 | grep -q Maven'"

          run_test "Ant installed" \
            "docker exec xubuntu-vm bash -c 'ant -version 2>&1 | grep -q Ant'"

          run_test "Ubuntu user exists" \
            "docker exec xubuntu-vm id ubuntu"

          run_test "SSH keys regenerated" \
            "docker exec xubuntu-vm test -f /etc/ssh/.keys_regenerated"

          run_test "adb available" \
            "docker exec xubuntu-vm which adb"

          # ── Windows Tests ──
          run_test "Windows container running" \
            "docker ps --filter name=windows-vm --filter status=running --format '{{.Names}}' | grep -qx windows-vm"

          # ── macOS Tests ──
          run_test "macOS container running" \
            "docker ps --filter name=macos-vm --filter status=running --format '{{.Names}}' | grep -qx macos-vm"

          # Close XML
          DURATION=$(($(date +%s) - START))
          echo "  </testsuite>" >> "$REPORT"
          echo "</testsuites>" >> "$REPORT"

          # Handle both GNU sed (Linux) and BSD sed (macOS)
          if sed --version 2>/dev/null | grep -q GNU; then
            sed -i "s/<testsuite name=\"VMValidation\">/<testsuite name=\"VMValidation\" tests=\"${TESTS}\" failures=\"${FAILURES}\" time=\"${DURATION}\">/" "$REPORT"
          else
            sed -i '' "s/<testsuite name=\"VMValidation\">/<testsuite name=\"VMValidation\" tests=\"${TESTS}\" failures=\"${FAILURES}\" time=\"${DURATION}\">/" "$REPORT"
          fi

          echo ""
          echo "═══ ${TESTS} tests, ${FAILURES} failures, ${DURATION}s ═══"
          echo ""
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          [ "$FAILURES" -eq 0 ] || exit 1

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: test-results/junit-report.xml
          retention-days: 90

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-results/junit-report.xml
          check_name: VM Validation
          fail_on_failure: true
